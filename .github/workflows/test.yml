name: Tests

# Every push and PR: typecheck, lint, and the unit + integration tests.
# Needs no secrets — integration tests run on PGlite (in-process Postgres)
# with Sleeper/ESPN faked, so nothing here touches Neon or the network.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # what Vercel runs the site on
          cache: npm

      - run: npm ci

      # Route types (PageProps<"/...">) are generated by Next, not committed.
      - run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
